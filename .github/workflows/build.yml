name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # إنشاء ملف pubspec.yaml وتضمين المكتبات الأساسية فقط
      - name: Create pubspec.yaml automatically
        run: |
          cat <<'EOF' > pubspec.yaml
          name: follower_x
          description: "Follower X App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            shared_preferences: ^2.2.2
            cupertino_icons: ^1.0.8
            youtube_player_flutter: ^9.0.1
            url_launcher: ^6.3.0
            image_picker: ^1.1.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      # إعادة إنشاء مجلد Android المفقود تلقائياً
      - name: Recreate Android Project Files if Missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org=com.example
          fi

      # إضافة كافة الصلاحيات وتفعيل مرور صور الشبكة عبر الإنترنت
      - name: Inject Android Permissions and Network Image Support
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' "$MANIFEST_PATH"
            sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' "$MANIFEST_PATH"
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"
          fi

      - name: Install Dependencies
        run: flutter pub get

      # إصلاح ملف ProGuard للمكتبات المنسخة تلقائياً
      - name: Fix Deprecated Proguard Rules
        run: |
          find ~/.pub-cache/ -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
